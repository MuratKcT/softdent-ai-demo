.hero h1{max-width:18ch;font-size:clamp(40px,6.4vw,72px)}
.hero .cta-row{margin-top:30px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(217,201,163,.22);border-radius:var(--r-md);overflow:hidden;margin-top:44px}
.stat{background:var(--ink);padding:18px 20px}
.stat b{display:block;font:500 clamp(28px,3.4vw,38px)/1 var(--serif);color:var(--gold-lt)}
.stat span{display:block;font-size:13.5px;color:var(--on-dark-2);margin-top:8px}

.sec-head{max-width:720px;margin-bottom:28px}
.sec-head h2{margin-top:12px}
.sec-head p{color:var(--ink-2);margin-top:12px;font-size:17px}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.why div{border-top:2px solid var(--gold);padding-top:18px}
.why h3{font-size:24px;margin-bottom:8px}
.why p{color:var(--ink-2);font-size:15px}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tool{background:var(--white);border:1px solid var(--beige);border-radius:var(--r-lg);padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;box-shadow:var(--sh-soft);transition:transform var(--t),box-shadow var(--t)}
.tool:hover{transform:translateY(-2px);box-shadow:var(--sh-lift)}
.tool-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tool-ic{width:52px;height:52px;border-radius:14px;background:var(--ink);color:var(--gold-lt);display:grid;place-items:center;flex-shrink:0}
.tool-ic svg{width:26px;height:26px}
.tool-no{font:500 15px/1 var(--serif);color:var(--taupe)}
.tool h3{font-size:30px;margin-top:18px}
.tool .tag{font:600 11.5px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dk);margin-top:6px}
.tool > p{color:var(--ink-2);margin-top:12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0 22px;padding-top:18px;border-top:1px solid var(--beige)}
.split h4{font:600 11.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.split ul{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:14.5px}
.split li{display:flex;gap:8px}
.split li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:8px;flex-shrink:0}
.tool .btn{margin-top:auto;align-self:flex-start}
@media (max-width:860px){.tools{grid-template-columns:1fr}}
@media (max-width:460px){.split{grid-template-columns:1fr}}
.data{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:stretch}
.data .dark{margin:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.fact b{display:block;font:500 40px/1 var(--serif);color:var(--gold-lt)}
.fact span{font-size:14px;color:var(--on-dark-2)}
.team{background:var(--white);border:1px solid var(--beige);border-radius:var(--r-lg);padding:24px}
.team .docs{margin-top:14px}
.team .doc{font-size:13.5px}
@media (max-width:860px){.data{grid-template-columns:1fr}}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:f}
.flow li{list-style:none;counter-increment:f;padding:0 18px 0 0;position:relative}
.flow li::before{content:"0" counter(f);display:block;font:500 15px/1 var(--serif);color:var(--gold-dk);margin-bottom:14px}
.flow li::after{content:"";position:absolute;left:34px;right:18px;top:8px;height:1px;background:var(--beige)}
.flow li:last-child::after{display:none}
.flow h3{font-size:22px;margin-bottom:6px}
.flow p{font-size:14.5px;color:var(--ink-2)}
.flow-wrap{padding:0;margin:0}
@media (max-width:860px){.flow{grid-template-columns:1fr 1fr;row-gap:28px}.flow li::after{display:none}}
@media (max-width:480px){.flow{grid-template-columns:1fr}}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.trust div{background:var(--sand);border-radius:var(--r-md);padding:20px}
.trust svg{width:24px;height:24px;color:var(--green)}
.trust h3{font-size:20px;margin:12px 0 6px}
.trust p{font-size:14px;color:var(--ink-2)}
@media (max-width:860px){.trust{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.trust{grid-template-columns:1fr}}

.stage{background:var(--white);border:1px solid var(--beige);border-radius:var(--r-lg);padding:24px}
.stage .lbl{color:var(--gold-dk)}
.stage h3{margin:10px 0 8px}
.stage p{font-size:14.5px;color:var(--ink-2)}
@media (max-width:820px){.stages{grid-template-columns:1fr}}
.final{text-align:center}
.final h2{max-width:20ch;margin:14px auto 0}
.final p{margin:14px auto 0}
.final .cta-row{justify-content:center}

      sg1l: 'Stage 1', sg1h: 'Configuration', sg1p: 'Verify price list, team and messaging with SoftDent. Agree on the tone of answers.',
      sg2l: 'Stage 2', sg2h: 'Integration', sg2p: 'Embed on softdent.com.pl in the site\'s colours, notifications for the front desk.',
      sg3l: 'Stage 3', sg3h: 'Pilot', sg3p: 'Testing with the team, refinements and launch for patients.',
      fin_l: 'Next step', fin_h: 'Try every tool <em>live</em>', fin_p: 'Ideally with your own photo or the question patients ask most often.'
    }
  });
  SDI.start();

  var $ = function (id) { return document.getElementById(id); };
  var t = SDI.t, C = SD.clinic;
  var ICONS = {
    umi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h1.6l1.2-1.8A1 1 0 0 1 8.6 4h6.8a1 1 0 0 1 .8.2L17.4 6H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.2"/></svg>',
    zara: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
    calc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18.5h8"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>'
  };
  var TOOLS = [['umi', 'Umi', 'umi/'], ['zara', 'Zara', 'zara/'], ['calc', null, 'kalkulator/'], ['chat', null, 'asystent/']];
  var li = function (s) { return s.split('|').map(function (x) { return '<li>' + x + '</li>'; }).join(''); };

  function render() {
    var q = '?lang=' + SDI.lang;
    var nPrices = SD.prices.reduce(function (n, c) { return n + c.o.length; }, 0);
    $('n-prices').textContent = nPrices; $('f-prices').textContent = nPrices;
    $('f-docs').textContent = SD.doctors.length; $('f-cats').textContent = SD.prices.length;
    $('f-addr').textContent = C.street + ', ' + C.city + ' · ' + C.phone;
    $('hero-umi').href = 'umi/' + q;
    $('tool-list').innerHTML = TOOLS.map(function (x, i) {
      var name = x[1] || t(x[0] === 'calc' ? 'nav_calc' : 'nav_chat');
      return '<article class="tool"><div class="tool-top"><span class="tool-ic">' + ICONS[x[0]] + '</span><span class="tool-no">0' + (i + 1) + '</span></div>'
        + '<h3>' + name + '</h3><div class="tag">' + t(x[0] + '_tag') + '</div><p>' + t(x[0] + '_p') + '</p>'
        + '<div class="split"><div><h4>' + t('t_pat') + '</h4><ul>' + li(t(x[0] + '_a')) + '</ul></div><div><h4>' + t('t_cli') + '</h4><ul>' + li(t(x[0] + '_b')) + '</ul></div></div>'
        + '<a class="btn" href="' + x[2] + q + '">' + t('t_open') + ' →</a></article>';
    }).join('');
    $('team').innerHTML = SD.doctors.map(function (d) {
      return '<span class="doc" title="' + SDI.L(d.r) + '"><i>' + SDI.initials(d.n) + '</i>' + d.n + '</span>';
    }).join('');
    $('fin-links').innerHTML = TOOLS.map(function (x, i) {
      return '<a class="btn ' + (i ? 'btn-line' : 'btn-gold') + '" href="' + x[2] + q + '">' + (x[1] || t(x[0] === 'calc' ? 'nav_calc' : 'nav_chat')) + '</a>';
    }).join('');
  }
  render(); SDI.onLang(render);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="sd-title" content="doc_title">
<title>Umi · SoftDent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%23292A24%27/%3E%3Cpath d=%27M10 9c2-1 4 0 6 0s4-1 6 0c2 1 2 5 1 8-1 2-1 6-3 6s-2-5-4-5-2 5-4 5-2-4-3-6c-1-3-1-7 1-8z%27 fill=%27%23B39A68%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/sd.css">
<style>
.intro h1{max-width:16ch}
.clin{background:var(--white);border:1px solid var(--beige);border-radius:var(--r-lg);margin-bottom:16px}
.clin summary{cursor:pointer;padding:18px 24px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
.clin summary::-webkit-details-marker{display:none}
.clin summary::after{content:"+";font:400 24px/1 var(--serif);color:var(--gold-dk)}
.clin[open] summary::after{content:"–"}
.clin-body{padding:0 24px 20px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--beige);font-size:14.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.kv code{background:var(--sand);padding:2px 8px;border-radius:4px}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:2px}}
.v-ok{color:#9ED3AE}.v-warn{color:#F0C978}.v-bad{color:#F2A08F}
.samples{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px;font-size:13.5px;color:var(--on-dark-2)}
.samples button{background:none;border:1px dashed rgba(217,201,163,.55);color:var(--on-dark);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:13px}
.samples button:hover{border-style:solid}
</style>
</head>
<body data-base="../" data-page="umi">
<header id="sd-head"></header>

<main class="page wrap narrow">
  <div class="restart-row">
    <span data-mode></span>
    <button class="restart" id="restart" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      <span data-i="restart"></span>
    </button>
  </div>

  <!-- 1 · Intro -->
  <section id="step-intro" class="step on">
    <div class="dark intro rise">
      <span class="eyebrow"><span class="dot"></span><span data-i="eyebrow"></span></span>
      <h1 style="margin-top:16px" data-ih="h1"></h1>
      <p class="lede" data-i="lede"></p>
      <div class="acts">
        <button class="act act-1" type="button" id="btn-cam">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h1.6l1.2-1.8A1 1 0 0 1 8.6 4h6.8a1 1 0 0 1 .8.2L17.4 6H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
          <span><span class="act-t" data-i="cam_t"></span><br><span class="act-s" data-i="cam_s"></span></span>
        </button>
        <button class="act act-2" type="button" id="btn-file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 15.5 16 11l-9 8.5"/></svg>
          <span><span class="act-t" data-i="file_t"></span><br><span class="act-s" data-i="file_s"></span></span>
        </button>
      </div>
      <input type="file" id="file-in" class="hide" accept="image/*">
      <input type="file" id="file-cam" class="hide" accept="image/*" capture="environment">
      <p class="err" id="err-start" role="alert"></p>
      <p class="shield">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v6c0 4.4 3 7.9 7 9 4-1.1 7-4.6 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
        <span data-i="shield"></span>
      </p>
    </div>

    <div class="gets">
      <div class="get rise"><div class="get-n" data-i="g1n"></div><h3 data-i="g1h"></h3><p data-i="g1p"></p></div>
      <div class="get rise"><div class="get-n" data-i="g2n"></div><h3 data-i="g2h"></h3><p data-i="g2p"></p></div>
      <div class="get rise"><div class="get-n" data-i="g3n"></div><h3 data-i="g3h"></h3><p data-i="g3p"></p></div>
    </div>
    <p class="fine" data-ih="fine"></p>
  </section>

  <!-- 2 · Confirm -->
  <section id="step-confirm" class="step">
    <nav class="prog">
      <span class="pn" data-s="on"><span class="pd">1</span><span data-i="p1"></span></span><span class="pl"></span>
      <span class="pn"><span class="pd">2</span><span data-i="p2"></span></span><span class="pl"></span>
      <span class="pn"><span class="pd">3</span><span data-i="p3"></span></span>
    </nav>
    <div class="grid2">
      <figure class="frame">
        <img id="preview" alt="">
        <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
        <button class="swap" type="button" id="btn-swap" data-i="swap"></button>
      </figure>
      <div class="card" style="margin:0">
        <h3 data-i="check_h"></h3>
        <p style="margin:8px 0 20px;color:var(--ink-2)" data-i="check_p"></p>
        <div class="field">
          <label for="complaint"><span data-i="compl_l"></span> <span class="opt" data-i="optional"></span></label>
          <textarea id="complaint" maxlength="500" data-iph="compl_ph"></textarea>
          <p class="hint" data-i="compl_hint"></p>
        </div>
        <button class="btn btn-block" id="btn-analyze" type="button">
          <span data-i="analyze"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <p class="consent" data-i="consent"></p>
        <p class="err" id="err-analyze" role="alert"></p>
      </div>
    </div>
  </section>

  <!-- 3 · Loading -->
  <section id="step-loading" class="step">
    <nav class="prog">
      <span class="pn" data-s="done"><span class="pd">✓</span><span data-i="p1"></span></span><span class="pl done"></span>
      <span class="pn" data-s="on"><span class="pd">2</span><span data-i="p2"></span></span><span class="pl"></span>
      <span class="pn"><span class="pd">3</span><span data-i="p3"></span></span>
    </nav>
    <div class="grid2">
      <figure class="frame"><img id="preview-2" alt=""><span class="scan"></span>
        <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span></figure>
      <div class="card load" style="margin:0">
        <h2 data-i="load_h"></h2>
        <p class="load-msg" id="load-msg"></p>
        <div class="rail"><i id="rail"></i></div>
        <ul class="steps" id="steps">
          <li><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 6 6L20 6"/></svg></span><span data-i="s1"></span></li>
          <li><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 6 6L20 6"/></svg></span><span data-i="s2"></span></li>
          <li><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 6 6L20 6"/></svg></span><span data-i="s3"></span></li>
          <li><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 6 6L20 6"/></svg></span><span data-i="s4"></span></li>
        </ul>
      </div>
    </div>
  </section>

  <!-- 4 · Result -->
  <section id="step-result" class="step">
    <nav class="prog">
      <span class="pn" data-s="done"><span class="pd">✓</span><span data-i="p1"></span></span><span class="pl done"></span>
      <span class="pn" data-s="done"><span class="pd">✓</span><span data-i="p2"></span></span><span class="pl done"></span>
      <span class="pn" data-s="on"><span class="pd">3</span><span data-i="p3"></span></span>
    </nav>

    <div class="dark rise">
      <span class="eyebrow"><span class="dot"></span><span data-i="prelim"></span></span>
      <p class="v-state v-ok" id="v-state"></p>
      <div class="scale" id="v-scale">
        <div class="scale-head"><span class="lbl" data-i="idx"></span><span class="scale-val"><b class="num" id="v-score">—</b> / 10</span></div>
        <div class="track"><span class="pin" id="v-pin" style="left:50%"></span></div>
        <div class="ticks"><span data-i="tick_l"></span><span data-i="tick_r"></span></div>
      </div>
    </div>

    <div class="card rise">
      <div class="lbl" data-i="concl"></div>
      <h3 id="res-title" style="margin-top:8px"></h3>
      <p id="res-summary" style="margin-top:10px;color:var(--ink-2)"></p>
      <div class="cost" id="res-cost">
        <div class="cost-main">
          <div class="lbl" style="margin-bottom:6px" data-i="cost_l"></div>
          <div class="cost-v num" id="res-price"></div>
          <ul class="pitems hide" id="res-items"></ul>
          <p class="pnote hide" id="res-note"></p>
        </div>
        <a id="price-link" target="_blank" rel="noopener" style="font-weight:600"><span data-i="pricelist"></span> →</a>
      </div>
    </div>

    <div class="card rise" id="plan-card">
      <div class="lbl" data-i="plan"></div>
      <ol class="plan" id="res-plan"></ol>
    </div>

    <div class="card rise">
      <div class="lbl" data-i="docs_l"></div>
      <div class="docs" id="res-docs"></div>
    </div>

    <details class="clin">
      <summary data-i="clin"></summary>
      <div class="clin-body"><dl style="margin:0">
        <div class="kv"><dt data-i="dx"></dt><dd id="res-dx">—</dd></div>
        <div class="kv"><dt data-i="icd"></dt><dd><code id="res-icd">—</code></dd></div>
        <div class="kv"><dt data-i="obj"></dt><dd id="res-tech">—</dd></div>
      </dl></div>
    </details>

    <div class="dark cta">
      <h3 data-i="cta_h"></h3>
      <p data-i="cta_p"></p>
      <div class="cta-row">
        <a class="btn" id="book-link" target="_blank" rel="noopener" data-i="book"></a>
        <a class="btn btn-line" id="call-link"></a>
      </div>
    </div>

    <div class="card" id="report-box">
      <h3 data-i="rep_h"></h3>
      <p style="margin:8px 0 20px;color:var(--ink-2)" data-i="rep_p"></p>
      <div class="two">
        <div class="field" style="margin:0"><label for="lead-name" data-i="name"></label><input type="text" id="lead-name" maxlength="100" autocomplete="given-name" data-iph="name_ph"></div>
        <div class="field" style="margin:0"><label for="lead-phone" data-i="phone"></label>
          <div class="tel"><span class="tel-c">+48</span><input type="tel" id="lead-phone" maxlength="11" placeholder="512 345 678" autocomplete="tel-national" inputmode="tel"></div></div>
      </div>
      <button class="btn btn-gold" style="margin-top:18px" id="btn-lead" type="button" data-i="send"></button>
      <p class="err" id="err-lead" role="alert"></p>
      <p class="consent" data-i="rep_note"></p>
    </div>
    <div id="lead-done" class="card hide"><p class="done">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
      <span data-i="lead_ok"></span></p></div>

    <p class="legal" data-i="legal"></p>
  </section>
</main>

<div class="cam" id="cam" role="dialog">
  <video id="feed" autoplay playsinline muted></video>
  <div class="cam-top"><button class="cam-b" type="button" id="cam-close" data-i="back"></button><button class="cam-b" type="button" id="cam-flip" data-i="flip"></button></div>
  <p class="cam-tip" data-i="cam_tip"></p>
  <div class="cam-bot"><button class="shutter" type="button" id="cam-shot" data-ial="cam_t"></button></div>
</div>

<footer id="sd-foot"></footer>

<script src="../assets/data.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/sd.js"></script>

  async function compress(blob) {
    var src;
    try { src = await createImageBitmap(blob, { imageOrientation: 'from-image' }); }
    catch (e) {
      src = await new Promise(function (res, rej) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = rej; im.src = URL.createObjectURL(blob); });
    }
    var k = Math.min(1, 1280 / Math.max(src.width, src.height));
    var c = document.createElement('canvas');
    c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  }
  async function usePhoto(file) {
    err('err-start');
    if (!file) return;
    if (file.size > 25 * 1024 * 1024) return err('err-start', t('e_big'));
    try { photo = await compress(file); } catch (e) { return err('err-start', t('e_open')); }
    $('preview').src = photo; $('preview-2').src = photo;
    go('confirm');
  }
  $('btn-file').addEventListener('click', function () { $('file-in').click(); });
  $('btn-swap').addEventListener('click', function () { $('file-in').click(); });
  $('file-in').addEventListener('change', function (e) { usePhoto(e.target.files[0]); e.target.value = ''; });
  $('file-cam').addEventListener('change', function (e) { usePhoto(e.target.files[0]); e.target.value = ''; });

  /* ── Camera ── */
  async function openCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return $('file-cam').click();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing } }, audio: false });
      $('feed').srcObject = stream;
      $('feed').style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
      $('cam').classList.add('on'); document.body.style.overflow = 'hidden';
    } catch (e) { $('file-cam').click(); }
  }
  function closeCam() {
    if (stream) stream.getTracks().forEach(function (tr) { tr.stop(); });
    stream = null; $('cam').classList.remove('on'); document.body.style.overflow = '';
  }
  $('btn-cam').addEventListener('click', function () { facing = 'environment'; openCam(); });
  $('cam-close').addEventListener('click', closeCam);
  $('cam-flip').addEventListener('click', function () { facing = facing === 'user' ? 'environment' : 'user'; closeCam(); openCam(); });
  $('cam-shot').addEventListener('click', function () {
    var v = $('feed'); if (!v.videoWidth) return;
    var c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
    var x = c.getContext('2d'); if (facing === 'user') { x.translate(c.width, 0); x.scale(-1, 1); }
    x.drawImage(v, 0, 0); closeCam();
    c.toBlob(function (b) { usePhoto(b); }, 'image/jpeg', 0.92);
  });

  /* ── Loading animation ── */
  var mT, bT;
  function startLoad() {
    var step = 0, items = $('steps').children, pct = 6;
    var msgs = ['m1', 'm2', 'm3', 'm4'];
    $('load-msg').textContent = t(msgs[0]);
    for (var i = 0; i < items.length; i++) items[i].removeAttribute('data-s');
    items[0].setAttribute('data-s', 'now');
    $('rail').style.width = pct + '%';
    mT = setInterval(function () {
      if (step >= msgs.length - 1) return;
      $('load-msg').classList.add('fade');
      setTimeout(function () {
        items[step].setAttribute('data-s', 'done'); step++;
        items[step].setAttribute('data-s', 'now');
        $('load-msg').textContent = t(msgs[step]); $('load-msg').classList.remove('fade');
      }, 200);
    }, 3800);
    bT = setInterval(function () { pct = Math.min(pct + 2.5, 93); $('rail').style.width = pct + '%'; }, 700);
  }
  function stopLoad() { clearInterval(mT); clearInterval(bT); $('rail').style.width = '100%'; }

  /* ── Analysis ── */
  $('btn-analyze').addEventListener('click', async function () {
    if (!photo) return err('err-analyze', t('e_pick'));
    err('err-analyze');
    var msg = ($('complaint').value || '').replace(/[<>{}`]/g, '').trim().slice(0, 500);
    var btn = this; btn.disabled = true;
    go('loading'); startLoad();
    try {
      var d = SDI.live()
        ? await SDI.api('sd-umi', { image: photo, message: msg || t('general'), lang: SDI.lang }, 90000)
        : await demo(msg);
      if (!d || (!d.analysis && !d.patient_view)) throw new Error('bad payload');
      stopLoad();
      last = d.analysis || d;
      render(last); go('result');
    } catch (e) {
      stopLoad(); console.error('[Umi]', e); go('confirm'); err('err-analyze', t('e_fail'));
    } finally { btn.disabled = false; }
  });

  /* ── Render ── */
  function render(d, keepScroll) {
    var tr = d.triage || {}, cls = 'v-ok', label = t('st_ok');
    var sev = parseFloat(String(tr.score == null ? '' : tr.score).replace('/10', ''));
    var hasSev = !isNaN(sev) && sev > 0;
    var invalid = (d.image_validation && d.image_validation.is_valid === false) || tr.level === 'FUNNY';
    if (invalid) { cls = 'v-warn'; label = t('st_inv'); }
    else if (tr.level === 'URGENT' || (hasSev && sev >= 7)) { cls = 'v-bad'; label = t('st_bad'); }
    else if (tr.level === 'MODERATE' || (hasSev && sev >= 4)) { cls = 'v-warn'; label = t('st_warn'); }
    $('v-state').className = 'v-state ' + cls; $('v-state').textContent = label;
    $('v-scale').classList.toggle('hide', invalid);
    /* AI score = severity (10 = urgent); the scale shows condition (10 = healthy) */
    var idx = hasSev ? Math.max(1, Math.min(10, Math.round(11 - sev))) : NaN;
    $('v-score').textContent = isNaN(idx) ? '—' : idx;
    $('v-pin').style.left = '50%';
    setTimeout(function () { $('v-pin').style.left = (isNaN(idx) ? 50 : Math.max(4, Math.min(96, idx * 10))) + '%'; }, 60);

    var p = d.patient_view || {};
    $('res-title').textContent = p.title || '';
    $('res-summary').textContent = p.summary || '';
    var items = (Array.isArray(p.price_items) ? p.price_items : []).filter(function (i) { return i && i.service && i.price; }).slice(0, 4);
    $('res-items').replaceChildren.apply($('res-items'), items.map(function (i) {
      var li = document.createElement('li'), s = document.createElement('span'), b = document.createElement('b');
      s.textContent = i.service; b.textContent = SDI.fixPrice(i.price);
      if (i.unit) { var sm = document.createElement('small'); sm.textContent = ' / ' + i.unit; b.appendChild(sm); }
      li.append(s, b); return li;
    }));
    $('res-items').classList.toggle('hide', !items.length);
    $('res-price').textContent = p.estimated_price_range ? SDI.fixPrice(p.estimated_price_range) : t('tbd');
    $('res-price').classList.toggle('hide', items.length > 0);
    $('res-cost').classList.toggle('hide', invalid);
    var note = [p.price_total_note, p.price_notes].filter(Boolean).join(' · ');
    $('res-note').textContent = note; $('res-note').classList.toggle('hide', !note);

    var plan = Array.isArray(p.action_plan) ? p.action_plan : [];
    $('res-plan').replaceChildren.apply($('res-plan'), plan.map(function (a) { var li = document.createElement('li'); li.textContent = String(a).replace(/^\d+\.\s*/, ''); return li; }));
    $('plan-card').classList.toggle('hide', !plan.length);

    var dv = d.doctor_view || {};
    $('res-dx').textContent = dv.suspected_diagnosis || '—';
    $('res-icd').textContent = dv.icd10_code || '—';
    $('res-tech').textContent = dv.technical_findings || '—';
    var docs = dv.recommended_specialists || [];
    if (typeof docs === 'string') docs = [docs];
    if (!docs.length) docs = [t('duty')];
    $('res-docs').replaceChildren.apply($('res-docs'), docs.slice(0, 3).map(function (nm) {
      var el = document.createElement('span'); el.className = 'doc';
      var ic = document.createElement('i'); ic.textContent = SDI.initials(nm) || '?';
      el.append(ic, document.createTextNode(nm)); return el;
    }));
  }

  /* ── Report request (demo: stays in the browser) ── */
  $('lead-phone').addEventListener('input', function (e) {
    var v = e.target.value.replace(/\D/g, '').slice(0, 9);
    e.target.value = v.replace(/(\d{3})(\d{0,3})(\d{0,3})/, function (m, a, b, c) { return [a, b, c].filter(Boolean).join(' '); });
  });
  $('btn-lead').addEventListener('click', function () {
    err('err-lead');
    var name = ($('lead-name').value || '').trim(), ph = ($('lead-phone').value || '').replace(/\D/g, '');
    if (name.length < 2) return err('err-lead', t('e_name'));
    if (ph.length !== 9) return err('err-lead', t('e_phone'));
    $('report-box').classList.add('hide'); $('lead-done').classList.remove('hide');
  });

  function reset() {
    photo = null; last = null;
    ['complaint', 'lead-name', 'lead-phone'].forEach(function (i) { $(i).value = ''; });
    $('report-box').classList.remove('hide'); $('lead-done').classList.add('hide');
    err('err-analyze'); err('err-lead'); stopLoad(); go('intro');
  }
  $('restart').addEventListener('click', reset);

  /* ── Built-in demo answer (used when no AI endpoint is configured) ── */
  async function demo(msg) {
    await new Promise(function (r) { setTimeout(r, 7000); });
    var pl = SDI.lang === 'pl';
    var P = SD.prices, find = function (k, i) { return P.filter(function (c) { return c.k === k; })[0].o[i]; };
    var it = function (o) { return { service: SDI.L({ pl: o.pl, en: o.en }), price: SDI.priceOf(o), unit: SDI.unitOf(o.u) }; };
    var items = [it(find('cons', 0)), it(find('hyg', 0)), it(find('endo', 0))];
    return { success: true, analysis: {
      image_validation: { is_valid: true, quality: 'good' },
      triage: { level: 'ROUTINE', score: 5 },
      patient_view: {
        title: pl ? 'Przebarwienia i możliwa próchnica' : 'Discolouration and possible decay',
        summary: pl ? 'Dziąsła wyglądają na zdrowe. Na jednym z zębów widać przebarwienie, które może być początkiem próchnicy. Po higienizacji lekarz oceni ubytek pod lupą i na zdjęciu RTG.'
                    : 'Your gums look healthy. One tooth shows a discoloured area that may be early decay. After a hygiene visit the dentist will check it under magnification and on an X-ray.',
        estimated_price_range: items[0].price, price_items: items,
        price_total_note: pl ? 'Całkowity koszt — po badaniu i RTG' : 'Total cost — after examination and X-ray',
        action_plan: pl ? ['Przegląd i zdjęcie RTG', 'Higienizacja', 'Leczenie ubytku'] : ['Check-up and X-ray', 'Hygiene visit', 'Treat the cavity']
      },
      doctor_view: {
        technical_findings: pl ? 'Przebarwienie powierzchni żującej, brzegi szkliwa zachowane. Złogi naddziąsłowe w odcinku przednim. Dziąsło bez cech stanu zapalnego.'
                               : 'Occlusal discolouration, enamel margins intact. Supragingival deposits in the anterior region. Gingiva without signs of inflammation.',
        suspected_diagnosis: pl ? 'Caries incipiens – próchnica początkowa' : 'Caries incipiens – early caries',
        icd10_code: 'K02.0', recommended_specialists: ['Magda Szała', 'Magdalena Nagrodzka']
      }
    } };
  }
})();
</script>
